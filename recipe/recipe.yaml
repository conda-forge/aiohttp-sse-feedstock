schema_version: 1

context:
  name: aiohttp-sse
  version: "3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 4c2158dc7221fbcad225699c2b7c368c15ae45ef195447ddd0ba3dea5af24c70

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=82.0.1
    - wheel >=0.47.0
  run:
    - python >=${{ python_min }}
    - aiohttp >=3.0

tests:
  - python:
      imports:
        - aiohttp_sse
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Server-sent events support for aiohttp
  description: |
    Server-sent events support for aiohttp
  homepage: https://github.com/aio-libs/aiohttp-sse
  repository: https://github.com/aio-libs/aiohttp-sse
  documentation: https://aioconsole.readthedocs.io/

extra:
  recipe-maintainers:
    - timkpaine
